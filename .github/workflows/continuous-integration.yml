name: CI
on: [push]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      # node-hid (pulled in transitively via @ledgerhq/hw-transport-node-hid) has no
      # prebuilt binary for the runner's current Node, so yarn install compiles it from
      # source whenever the node_modules cache misses (e.g. any yarn.lock change). That
      # source build needs libusb headers, which ubuntu-latest does not ship by default.
      - name: Install native build dependencies (node-hid → libusb)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Install Yarn dependencies
        run: yarn install

      - name: Run solhint
        run: yarn solhint

      - name: Run prettier
        run: yarn prettier

      - name: Hardhat clean
        run: npx hardhat clean

      - name: Compile contracts
        run: yarn compile

      - name: Run tests
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
        run: |
          yarn test
